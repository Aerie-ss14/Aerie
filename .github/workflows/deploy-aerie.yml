name: Deploy Aerie

on:
  push:
    branches:
    - master
  workflow_dispatch:

concurrency:
  group: deploy-aerie
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4.2.2
      with:
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: 10.0.x

    - name: Fetch engine tag
      run: |
        cd RobustToolbox
        git fetch --depth=1

    - name: Restore
      run: dotnet restore

    - name: Build packaging
      run: dotnet build Content.Packaging --configuration Release --no-restore /m

    - name: Package linux server
      run: dotnet run --project Content.Packaging server --platform linux-x64

    - name: Configure SSH
      env:
        AERIE_VM_HOST: ${{ secrets.AERIE_VM_HOST }}
        AERIE_VM_SSH_KEY: ${{ secrets.AERIE_VM_SSH_KEY }}
      run: |
        test -n "$AERIE_VM_HOST"
        test -n "$AERIE_VM_SSH_KEY"
        install -d -m 700 ~/.ssh
        printf '%s\n' "$AERIE_VM_SSH_KEY" > ~/.ssh/aerie_deploy
        chmod 600 ~/.ssh/aerie_deploy
        ssh-keyscan -H "$AERIE_VM_HOST" >> ~/.ssh/known_hosts

    - name: Upload artifact
      env:
        AERIE_VM_HOST: ${{ secrets.AERIE_VM_HOST }}
        AERIE_VM_PORT: ${{ secrets.AERIE_VM_PORT }}
      run: |
        port="${AERIE_VM_PORT:-22}"
        scp -P "$port" -i ~/.ssh/aerie_deploy release/SS14.Server_linux-x64.zip \
          "aerie-deploy@${AERIE_VM_HOST}:/opt/aerie/incoming/SS14.Server_linux-x64-${GITHUB_SHA}.zip"

    - name: Activate release
      env:
        AERIE_VM_HOST: ${{ secrets.AERIE_VM_HOST }}
        AERIE_VM_PORT: ${{ secrets.AERIE_VM_PORT }}
      run: |
        port="${AERIE_VM_PORT:-22}"
        ssh -p "$port" -i ~/.ssh/aerie_deploy "aerie-deploy@${AERIE_VM_HOST}" \
          "sudo /usr/local/sbin/aerie-deploy /opt/aerie/incoming/SS14.Server_linux-x64-${GITHUB_SHA}.zip ${GITHUB_SHA}"
